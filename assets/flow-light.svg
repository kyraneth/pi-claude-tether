<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-sequence" viewBox="0 0 687 469" width="687" height="469" style="max-width:100%;height:auto;color:#1f2328;font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328" role="graphics-document document" aria-roledescription="sequence" aria-labelledby="pele-title" aria-describedby="pele-desc"><title id="pele-title">The tool call path through the Claude tether</title><desc id="pele-desc">Pi sends the prompt to the model through the tether and the official CLI. The model's tool call comes back the same way to Pi, which runs the tool and saves the result, and only then does the result go back to the model.</desc><g transform="translate(109.43,8)"><g class="pele-lifelines" fill="none" stroke="#d1d9e0"><path class="pele-lifeline" data-id="P" d="M0,44V409"/><path class="pele-lifeline" data-id="T" d="M111.43,44V409"/><path class="pele-lifeline" data-id="C" d="M294.59,44V409"/><path class="pele-lifeline" data-id="S" d="M503.97,44V409"/></g><g class="pele-edges" fill="none" stroke="#59636e" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i0"><path d="M0,87H496.97"/><path class="pele-marker" d="M503.97,87L495.97,90.36L495.97,83.64Z" fill="#59636e" stroke="none"/></g><g class="pele-edge pele-message" data-id="i1"><path d="M503.97,124H301.59" stroke-dasharray="4 4"/><path class="pele-marker" d="M294.59,124L302.59,120.64L302.59,127.36Z" fill="#59636e" stroke="none"/></g><g class="pele-edge pele-message" data-id="i2"><path d="M294.59,161H118.43" stroke-dasharray="4 4"/><path class="pele-marker" d="M111.43,161L119.43,157.64L119.43,164.36Z" fill="#59636e" stroke="none"/></g><g class="pele-edge pele-message" data-id="i3"><path d="M111.43,198H7" stroke-dasharray="4 4"/><path class="pele-marker" d="M0,198L8,194.64L8,201.36Z" fill="#59636e" stroke="none"/></g><g class="pele-edge